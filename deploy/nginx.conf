# Replace example.com, certificate paths, /srv/pairwise and the PHP-FPM socket.
server {
    listen 80;
    server_name example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name example.com;
    ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    root /srv/pairwise/frontend/dist;
    index index.html;
    charset utf-8;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;

    location /api/ { include /srv/pairwise/deploy/laravel-fastcgi.conf; }
    location /sanctum/ { include /srv/pairwise/deploy/laravel-fastcgi.conf; }
    location = /up { include /srv/pairwise/deploy/laravel-fastcgi.conf; }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location / { try_files $uri $uri/ /index.html; }
    location ~ \.php$ { return 404; }
    location ~ /\. { deny all; }
}
