# Included only by Laravel endpoint locations in nginx.conf.
include fastcgi_params;
fastcgi_param SCRIPT_FILENAME /srv/pairwise/backend/public/index.php;
fastcgi_param SCRIPT_NAME /index.php;
fastcgi_param DOCUMENT_ROOT /srv/pairwise/backend/public;
fastcgi_param HTTPS on;
fastcgi_pass unix:/run/php/php8.3-fpm.sock;
fastcgi_hide_header X-Powered-By;
